name: Collect CTI Data

on:
  workflow_dispatch:
  schedule:
    - cron: "10 6,12,18,23 * * *"
      timezone: "America/Sao_Paulo"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collectors
        run: python collectors/collect.py

      - name: Commit collected data
        run: |
          git config user.name "Cyber Conflict Watch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily/

          if git diff --cached --quiet; then
            echo "No new data to commit"
          else
            git commit -m "data: automated CTI collection"
            git push
          fi
